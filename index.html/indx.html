<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صبري | يوتيوب 🔥</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a12;color:#fff;font-family:sans-serif;padding:14px;text-align:center}
.box{max-width:520px;margin:auto}
.hero{background:linear-gradient(135deg,#ff0000,#7c3aed,#00d2ff);background-size:300% 300%;animation:g 4s infinite;padding:3px;border-radius:28px;box-shadow:0 0 30px #ff0000}
@keyframes g{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.inner{background:#111;padding:20px;border-radius:26px}
.avatar{width:80px;height:80px;margin:auto;background:#ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid #fff;box-shadow:0 0 20px #ff0000}
h1{margin:10px 0 0;font-size:32px} h1 span{color:#ff0000}
p{color:#bbb;font-size:13px;margin:6px 0}
.search{display:flex;gap:8px;background:#222;border:1px solid #444;padding:6px;border-radius:50px;margin:16px 0}
.search
